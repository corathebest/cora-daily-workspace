<style>

nt-size:10px;color:#8f7ba8;background:#f6f3fa;border-radius:20px;padding:3px 7px;white-space:nowrap}.task span{flex:1}.task.done span{text-decoration:line-through;color:#9d9290}.delete{border:0;background:none;color:#b4a9a5;font-size:18px}.delete:hover{color:#bc6d58}.add-row{display:flex;gap:8px;margin-top:12px}.add-row input,.food-form input,.steps-input{min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:white;color:var(--ink);outline:none}.add-row input:focus,.food-form input:focus,.steps-input:focus{border-color:var(--green)}.add-row input{flex:1}.add-row select{border:1px solid var(--line);border-radius:10px;padding:0 10px;background:white;color:var(--ink)}.task-hint{margin:10px 0 0;padding:8px 10px}.addbtn{padding:9px 13px}.lower{display:block}.monthly-grid{display:block}.month-period{font-size:11px;color:var(--muted);margin-top:2px}.monthly-list{min-height:38px}.monthly-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f2eff6;font-size:13px}.monthly-item:last-child{border-bottom:0}.monthly-item small{color:var(--muted);margin-left:8px}.monthly-form{display:flex;gap:8px;margin-top:10px}.monthly-form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:white;color:var(--ink);outline:none}.monthly-form input:focus{border-color:var(--green)}.monthly-form .addbtn{padding:8px 11px}.book-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.book-card{border:1px solid #f0edf5;border-radius:14px;padding:12px;background:#fdfcff}.book-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.book-head strong{font-size:14px}.book-head small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.page-form{display:flex;gap:6px;margin-top:10px}.page-form input{width:92px;min-width:0;border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:12px}.page-form button{border:0;border-radius:9px;padding:7px 9px;background:var(--pale);color:#786393;font-size:12px}.reading-log{margin-top:7px;max-height:112px;overflow:auto}.reading-entry{display:flex;justify-content:space-between;gap:6px;padding:4px 0;color:var(--muted);font-size:11px;border-bottom:1px solid #f2eff6}.reading-entry:last-child{border:0}.book-completed{font-size:11px;color:#917daa;background:#f4f0f8;padding:4px 7px;border-radius:10px}.meal{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0e9e4;font-size:13px}.meal:last-of-type{border:0}.meal span:last-child{color:var(--muted)}.meal-name{color:var(--ink)}.food-form{display:grid;grid-template-columns:1fr 84px 42px;gap:7px;margin-top:12px}.food-form input{padding:8px 9px;font-size:13px}.photo-pick{grid-column:1/-1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px dashed #ddd4eb;border-radius:12px;padding:10px;background:#faf8fd;color:#8f79aa;cursor:pointer;font-size:13px}.photo-pick input{display:none}.photo-preview{grid-column:1/-1;display:none}.photo-preview img{width:84px;height:84px;object-fit:cover;border-radius:16px;border:3px solid white;box-shadow:0 4px 14px #332a3220;transform:rotate(-3deg)}.meal{align-items:center;gap:10px}.meal-photo{width:48px;height:48px;object-fit:cover;border-radius:12px;transform:rotate(-3deg);border:2px solid white;box-shadow:0 3px 10px #332a3215}.meal-main{display:flex;align-items:center;gap:10px;flex:1}.meal-info{display:flex;flex-direction:column}.meal-info small{color:var(--muted);font-size:11px}.food-form button{border:0;border-radius:9px;background:var(--pale);color:var(--green);font-size:18px}.total{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}.stepsbox{display:flex;align-items:center;gap:10px;margin-top:14px}.steps-input{width:100%;font-size:22px;font-weight:650}.stepsbox small{white-space:nowrap;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8f6fc;border:1px solid #f0edf7;border-radius:14px;padding:12px}.stat label{color:#888397}.stat strong{color:#423a50}.stat label{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:4px;font-size:18px}.empty{color:#9d9290;text-align:center;padding:18px 0;font-size:13px}.foot{text-align:center;font-size:11px;color:#9d9290;margin-top:18px}@media(max-width:760px){.book-list{grid-template-columns:1fr}.app{padding:18px 14px 35px}.layout{grid-template-columns:1fr}.monthly-grid{grid-template-columns:1fr}.calendar{padding:13px 14px}.hint{margin-top:12px}.date-title h2{font-size:22px}}
.floral-decor{position:fixed;width:250px;height:250px;pointer-events:none;z-index:0;opacity:.42;filter:blur(5px);background:radial-gradient(ellipse 20% 15% at 50% 22%,#eee8f6 25%,transparent 76%),radial-gradient(ellipse 20% 15% at 77% 42%,#f2eaf7 24%,transparent 76%),radial-gradient(ellipse 20% 15% at 66% 73%,#eee8f6 24%,transparent 76%),radial-gradient(ellipse 20% 15% at 34% 73%,#f5edf8 24%,transparent 76%),radial-gradient(ellipse 20% 15% at 23% 42%,#eee8f6 24%,transparent 76%),radial-gradient(circle at 50% 51%,#eadfc9 0 2%,transparent 3%)}.floral-top{right:-44px;top:-48px}.floral-bottom{left:-52px;bottom:-58px;transform:rotate(24deg) scale(.78);opacity:.3}.app{position:relative;z-index:1}

<body><div class="app">
<header class="top"><div class="brand"><div class="logo" aria-label="栀子花"><svg viewBox="0 0 40 40" width="27" height="27" aria-hidden="true"><defs><radialGradient id="gardeniaPetal" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f1eafa"/></radialGradient><radialGradient id="gardeniaCenter"><stop offset="0" stop-color="#f7e8bd"/><stop offset="1" stop-color="#dfc991"/></radialGradient></defs><g fill="url(#gardeniaPetal)" stroke="#fff" stroke-width=".8" stroke-linejoin="round"><path d="M20 21C14 18 11 12 14 7c2-3 6-2 8 1 2 4 1 9-2 13Z"/><path d="M20 20c-1-7 3-13 8-13 4 0 5 4 3 8-2 4-6 7-11 7Z"/><path d="M21 20c6-5 13-4 15 1 1 4-2 7-6 7-5 0-8-3-9-8Z"/><path d="M20 21c7 1 11 7 8 12-2 3-6 3-9 0-3-4-3-8 1-12Z"/><path d="M19 21c2 7-2 13-7 12-4 0-5-4-3-8 2-4 6-6 10-4Z"/><path d="M19 20c-6 4-13 2-14-3-1-4 2-7 6-7 5 0 8 4 8 10Z"/></g><g fill="#f6edf9" stroke="#fff" stroke-width=".6"><path d="M20 20c-3-4-2-8 1-9 3 2 3 6-1 9Z"/><path d="M20 20c1-4 5-6 7-4 0 3-3 6-7 4Z"/><path d="M20 20c4 1 6 4 4 7-3 0-6-3-4-7Z"/><path d="M20 20c0 4-3 6-6 4 0-3 3-6 6-4Z"/></g><circle cx="20" cy="20" r="2.1" fill="url(#gardeniaCenter)"/></svg></div><div><h1><span class="cora-word">Cora</span><span>的每日工作台</span></h1><p>别忘了答应自己的事</p></div></div><button class="today-btn" id="todayBtn">回到今天</button></header>
<div class="layout"><aside class="card calendar" id="calendar"><div class="monthhead"><div class="month-caption"><h2 id="monthLabel"></h2><span id="selectedDateLabel"></span></div><div class="month-actions"><div class="arrows"><button class="navbtn" id="prev" aria-label="上个月">‹</button><button class="navbtn" id="next" aria-label="下个月">›</button></div><button class="calendar-toggle" id="calendarToggle" aria-expanded="false">展开日历⌄</button></div></div><div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="days" id="days"></div><p class="hint">选择日期查看或记录当天的任务、饮食和步数。小圆点表示这天有记录。</p></aside>
<main class="maincol"><section class="card"><div class="date-title"><div><div class="eyebrow">DAILY CHECK-IN</div><h2 id="dateTitle"></h2></div><div class="completion" id="completion"></div></div><div class="progress"><span id="progress"></span></div></section>
<section class="card"><div class="section-head"><h3>✅ 今日任务</h3><span class="count" id="taskCount"></span></div><div id="taskList" class="task-list"></div><form id="taskForm" class="add-row"><input id="taskInput" maxlength="100" placeholder="添加一件要做的事…" autocomplete="off"><select id="taskKind" aria-label="任务类型"><option value="today">仅今天</option><option value="fixed">每天固定</option></select><button class="addbtn">添加</button></form><div class="hint task-hint">选择“每天固定”，这件事就会出现在之后每一天。</div></section>
<div class="lower"><section class="card"><div class="section-head"><h3>🍽️ 饮食记录</h3><span class="count">照片小贴纸</span></div><div id="foodList"></div><form id="foodForm" class="food-form"><label class="photo-pick">📷 拍照 / 选照片<input id="photoInput" type="file" accept="image/*" capture="environment"></label><div id="photoPreview" class="photo-preview"></div><input id="foodInput" maxlength="60" placeholder="餐次或食物" autocomplete="off"><input id="calInput" type="number" min="0" max="9999" placeholder="热量（千卡）"><button aria-label="添加饮食">＋</button></form><div class="total"><span>今日估算总热量</span><span id="calTotal">0 千卡</span></div></section>
</div>
<div class="monthly-grid"><section class="card"><div class="section-head"><div><h3>🎬 本月观影</h3><div id="moviePeriod" class="month-period"></div></div><span class="count"><strong id="movieCount">0</strong> 部</span></div><div id="movieList" class="monthly-list"></div><form id="movieForm" class="monthly-form"><input id="movieInput" maxlength="80" placeholder="记录看完的电影…" autocomplete="off"><button class="addbtn">记录</button></form></section></div>
<section class="card"><div class="section-head"><div><h3>📖 本月读书</h3><div id="bookPeriod" class="month-period"></div></div><span class="count"><strong id="bookCount">0</strong> 次阅读记录</span></div><form id="newBookForm" class="monthly-form"><input id="newBookInput" maxlength="80" placeholder="新读一本书，就从这里开始…" autocomplete="off"><button class="addbtn">开始读</button></form><div id="readingBooks" class="book-list"></div></section>
<section class="card"><div class="section-head"><h3>📊 当日小结</h3><span class="count">根据当天记录自动更新</span></div><div class="stats"><div class="stat"><label>任务完成率</label><strong id="statRate">—</strong></div><div class="stat"><label>饮食热量</label><strong id="statCal">0 千卡</strong></div></div></section>
</main></div><div class="foot">记录保存在当前浏览器中 · 暂时只在这台设备和这个浏览器里可见</div></div>
<script>
const $=s=>document.querySelector(s);const today=new Date();const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let selected=iso(today),shown=new Date(today.getFullYear(),today.getMonth(),1);const key='daily-workspace-v1';let store={};try{store=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{};let removedStepData=false;for(const day of Object.values(store)){if(day&&typeof day==='object'&&Object.prototype.hasOwnProperty.call(day,'steps')){delete day.steps;removedStepData=true}}if(removedStepData)localStorage.setItem(key,JSON.stringify(store));if(!Array.isArray(store.readingBooks)){store.readingBooks=(store.books||[]).map(b=>({id:String(b.id||Date.now()+Math.random()),title:b.title,logs:[],completedDate:b.date,completed:true}));store.books=[];localStorage.setItem(key,JSON.stringify(store))};const record=()=>store[selected]||(store[selected]={tasks:[],foods:[],steps:''});function save(){localStorage.setItem(key,JSON.stringify(store))}function renderCalendar(){let y=shown.getFullYear(),m=shown.getMonth();$('#monthLabel').textContent=`${y}年${m+1}月`;let sd=new Date(+selected.slice(0,4),+selected.slice(5,7)-1,+selected.slice(8,10));$('#selectedDateLabel').textContent=`${sd.getMonth()+1}月${sd.getDate()}日`;let first=new Date(y,m,1),offset=(first.getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),arr=[];for(let i=0;i<42;i++){let n=i-offset+1,d;if(n<1)d=new Date(y,m-1,prevDays+n);else if(n>daysIn)d=new Date(y,m+1,n-daysIn);else d=new Date(y,m,n);let id=iso(d),isCur=d.getMonth()===m,has=!!((store[id]&&(store[id].tasks?.length||store[id].foods?.length||store[id].steps||Object.keys(store[id].fixedDone||{}).length))||store.movies?.some(x=>x.date===id)||store.readingBooks?.some(b=>b.completedDate===id||b.logs?.some(x=>x.date===id)));arr.push(`<button class="day ${isCur?'':'muted'} ${id===selected?'selected':''} ${id===iso(today)?'today':''}" data-date="${id}">${d.getDate()}${has?'<i class="dot"></i>':''}</button>`)}$('#days').innerHTML=arr.join('');$('#days').querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;shown=new Date(+selected.slice(0,4),+selected.slice(5,7)-1,1);render()})}function render(){renderCalendar();const d=new Date(+selected.slice(0,4),+selected.slice(5,7)-1,+selected.slice(8,10));$('#dateTitle').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日${selected===iso(today)?' · 今天':''}`;let r=record(),tasks=r.tasks||[],fixed=store.fixedTasks||[];r.fixedDone=r.fixedDone||{};let done=fixed.filter(t=>r.fixedDone[t.id]).length+tasks.filter(t=>t.done).length,total=fixed.length+tasks.length,rate=total?Math.round(done/total*100):0;$('#completion').textContent=total?`${done} / ${total} 完成 · ${rate}%`:'还没有任务';$('#progress').style.width=rate+'%';$('#taskCount').textContent=`${done}/${total} 完成`;let all=[...fixed.map(t=>({text:t.text,done:!!r.fixedDone[t.id],kind:'fixed',id:t.id})),...tasks.map((t,i)=>({text:t.text,done:t.done,kind:'today',i}))];$('#taskList').innerHTML=all.length?all.map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} data-kind="${t.kind}" data-key="${t.kind==='fixed'?t.id:t.i}"><span>${escapeHtml(t.text)}</span><small class="task-tag">${t.kind==='fixed'?'固定':'今天'}</small><button type="button" class="delete" data-remove="${t.kind}" data-key="${t.kind==='fixed'?t.id:t.i}" aria-label="删除任务">×</button></label>`).join(''):'<div class="empty">添加一件小事，开始今天吧。</div>';$('#taskList').querySelectorAll('[data-kind]').forEach(x=>x.onchange=()=>{let r=record();if(x.dataset.kind==='fixed'){r.fixedDone=r.fixedDone||{};if(x.checked)r.fixedDone[x.dataset.key]=true;else delete r.fixedDone[x.dataset.key]}else r.tasks[+x.dataset.key].done=x.checked;save();render()});$('#taskList').querySelectorAll('[data-remove]').forEach(x=>x.onclick=e=>{e.preventDefault();e.stopPropagation();if(x.dataset.remove==='fixed')store.fixedTasks=store.fixedTasks.filter(t=>String(t.id)!==x.dataset.key);else r.tasks.splice(+x.dataset.key,1);save();render()});let foods=r.foods||[],cal=foods.reduce((a,f)=>a+(Number(f.cal)||0),0);$('#foodList').innerHTML=foods.length?foods.map((f,i)=>`<div class="meal"><div class="meal-main">${f.photo?`<img class="meal-photo" src="${f.photo}" alt="饮食照片贴纸">`:''}<div class="meal-info"><span class="meal-name">${escapeHtml(f.name||'饮食记录')}</span><small>${f.cal==null?'热量待填写':Number(f.cal).toLocaleString()+' 千卡'}</small></div></div><button class="delete" data-fooddel="${i}" aria-label="删除饮食">×</button></div>`).join(''):'<div class="empty">拍下今天吃的东西，做成一张小贴纸。</div>';$('#foodList').querySelectorAll('[data-fooddel]').forEach(x=>x.onclick=()=>{r.foods.splice(+x.dataset.fooddel,1);save();render()});$('#calTotal').textContent=`${cal.toLocaleString()} 千卡`;let monthKey=selected.slice(0,7),monthLabel=`${+monthKey.slice(5)}月`;store.movies=store.movies||[];store.readingBooks=store.readingBooks||[];let movies=store.movies.filter(x=>x.date.slice(0,7)===monthKey),readingSessions=store.readingBooks.flatMap(b=>(b.logs||[]).filter(x=>x.date.slice(0,7)===monthKey));$('#moviePeriod').textContent=monthLabel;$('#bookPeriod').textContent=monthLabel;$('#movieCount').textContent=movies.length;$('#bookCount').textContent=readingSessions.length;$('#movieList').innerHTML=movies.length?movies.map(x=>`<div class="monthly-item"><span>${escapeHtml(x.title)}<small>${+x.date.slice(8)}日</small></span><button class="delete" data-movie-del="${x.id}" aria-label="删除观影记录">×</button></div>`).join(''):'<div class="empty">还没有观影记录。</div>';$('#movieList').querySelectorAll('[data-movie-del]').forEach(x=>x.onclick=()=>{store.movies=store.movies.filter(v=>v.id!==x.dataset.movieDel);save();render()});$('#readingBooks').innerHTML=store.readingBooks.length?store.readingBooks.map(b=>{let logs=(b.logs||[]).slice().sort((a,c)=>a.date.localeCompare(c.date)),last=logs[logs.length-1];return `<div class="book-card"><div class="book-head"><div><strong>${escapeHtml(b.title)}</strong><sm
